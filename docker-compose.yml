name: estixa

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Punto de montaje CORRECTO para la imagen postgres:18: /var/lib/postgresql
    # (verificado con `docker inspect postgres:18` — la ruta antigua
    # /var/lib/postgresql/data de versiones previas de la imagen YA NO es
    # donde esta imagen guarda los datos; PGDATA interno es
    # /var/lib/postgresql/18/docker, dentro de este volumen).
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    # Sin "ports:" a propósito — Postgres no debe ser alcanzable desde el host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SUPERADMIN_SECRET: ${JWT_SUPERADMIN_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Cantidad de proxies de confianza delante de la app (Express
      # "trust proxy"). 1 = Caddy delante (default). Subir a 2 si se pone
      # Cloudflare delante de Caddy, y en ese caso también configurar
      # trusted_proxies en Caddy.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Sin "ports:" a propósito — solo Caddy es alcanzable desde el host.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1',r=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  caddy:
    build:
      context: ./beautyflow-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Host de la app de negocio (RENOMBRADO de SITE_ADDRESS). Local:
      # ":80" (default si no se define). Producción: "app.estixa.com" —
      # Caddy obtiene/renueva el certificado HTTPS automáticamente y
      # necesita persistir ese estado en caddy_data (de ahí el volumen).
      APP_HOST: ${APP_HOST:-:80}
      # Opcional — host del panel de SuperAdmin (ej. "admin.estixa.com").
      # Sin definir, /admin/login sigue funcionando en APP_HOST como
      # siempre (modo local, un solo host). Ver beautyflow-web/Caddyfile.
      #
      # El default AQUÍ es el mismo sentinela inerte que usa el Caddyfile
      # ("http://admin.invalid"), NUNCA vacío: si el .env real no define
      # ADMIN_HOST, Compose igual crea la variable dentro del contenedor
      # (solo que vacía) — y Caddy, a diferencia de Compose, NO trata
      # "definida pero vacía" igual que "no definida": su propio default
      # `{$ADMIN_HOST:http://admin.invalid}` del Caddyfile nunca se aplica
      # en ese caso, y una dirección de sitio vacía hace que `caddy
      # validate`/`caddy run` fallen con "server block without any key is
      # global configuration, and if used, it must be first" (confirmado
      # con el binario real). Poniendo el sentinela acá, en el propio
      # default de Compose, el contenedor nunca ve ADMIN_HOST vacía.
      ADMIN_HOST: ${ADMIN_HOST:-http://admin.invalid}
      # Opcional — dominio(s) raíz que solo redirigen a la app (ej.
      # "estixa.com, www.estixa.com" — coma CON espacio, Caddy exige esa
      # sintaxis). Requiere APP_PUBLIC_URL si se define. Mismo criterio
      # de default que ADMIN_HOST (sentinela "http://root.invalid", no
      # vacío) y por la misma razón.
      ROOT_HOSTS: ${ROOT_HOSTS:-http://root.invalid}
      # URL pública completa de la app de negocio (con esquema, sin barra
      # final) — a donde redirige ROOT_HOSTS. Ej. "https://app.estixa.com".
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # No usar http://localhost:80/: con un dominio real, Caddy redirige a
      # https:// y el healthcheck falla por falta de certificado para
      # "localhost" aunque el servicio esté sano. El puerto 2019 es la API
      # de administración de Caddy (solo accesible dentro del contenedor,
      # nunca publicada al host) — más confiable como sonda de salud.
      # Usar 127.0.0.1 y NO "localhost": busybox wget (el wget de la
      # imagen caddy:2-alpine) resuelve "localhost" primero a ::1 (IPv6),
      # y la API de admin de Caddy solo escucha en IPv4 — con "localhost"
      # da "Connection refused" aunque el servicio esté sano (verificado
      # contra el servidor real).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
